[project]
name = "dry-bean-ml-assignment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib==1.5.2",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "streamlit==1.50.0",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "ruff", "tqdm", "pytest", "playwright", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
